version: '3.8'

services:
  ##############################
  # 1) ZooKeeper
  ##############################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      # Zookeeper requires a client port and a basic tick time
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    # The default Docker network allows other services to reach "zookeeper:2181"

  ##############################
  # 2) Kafka Broker
  ##############################
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # Each broker needs a unique ID
      KAFKA_BROKER_ID: 1
      # Point Kafka to the local Zookeeper container
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      #
      # Expose Kafka internally and externally:
      # - 0.0.0.0:9092 means "listen on all interfaces inside container"
      # - 'PLAINTEXT://kafka:9092' is the advertised listener that internal clients use.
      #
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,OUTSIDE://localhost:9094      #
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  ##############################
  # 3) Vision/DeepStream App
  ##############################
  vision:
    build:
      context: .
      dockerfile: ./people_tracking/Dockerfile
      args:
        CUDA_VER: ${CUDA_VER}
    container_name: tracking
    image: tracking
    depends_on:
      - kafka   # ensures Kafka is started before vision
    # If you need to map any ports from 'vision' to your host, do it here. Example:
    # ports:
    #   - "5000:5000"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data
      - ./vision/cfg:/app/cfg

    # If you need your camera in the container:
    devices:
      - /dev/video0

    environment:
      - TZ=Europe/Berlin
      - CUDA_VER=12.2
      - DISPLAY=:1
      # Let your vision app know how to connect to Kafka using the service name
      - KAFKA_BROKER=kafka:9092

    working_dir: /app
    command: python3 vision.py
    restart: unless-stopped
    privileged: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 7g


  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
      - "4572:4572"
    environment:
      - SERVICES=s3
      - DOCKER_HOST=unix:///var/run/docker.sock
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curated